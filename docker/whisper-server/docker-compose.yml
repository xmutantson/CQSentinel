version: '3.8'

services:
  # Custom build version with our server
  whisper-custom:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cqsentinel-whisper-custom
    ports:
      - "8000:8000"
    environment:
      - WHISPER_MODEL=medium.en
      - WHISPER_DEVICE=cuda
      - WHISPER_COMPUTE_TYPE=float16
      - WHISPER_HOST=0.0.0.0
      - WHISPER_PORT=8000

    # GPU support (NVIDIA)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
